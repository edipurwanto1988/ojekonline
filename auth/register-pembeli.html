<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrasi Pembeli</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/app.js" defer></script>
</head>
<body>
<div class="app no-nav">
  <header class="topbar"><a class="back" href="login.html">‹</a><h1>Registrasi Pembeli</h1></header>
  <section class="section">
    <div class="field"><label>User ID</label><input class="input" placeholder="contoh: budi_01"><div class="hint">Nama pembeli sebagai ID login</div></div>
    <div class="field"><label>Nama lengkap</label><input class="input" placeholder="Budi Santoso"></div>
    <div class="field"><label>Nomor WA</label><input class="input" placeholder="08xxxxxxxxxx"></div>
    <div class="field"><label>Password</label><input class="input" type="password"></div>
    <div class="field"><label>Alamat pengantaran</label><textarea class="textarea" placeholder="Jalan, RT/RW, patokan"></textarea></div>
    <div class="field"><label>Pin lokasi (opsional)</label><div class="upload" style="padding:14px">📍 Ambil lokasi saat ini</div></div>
    <a class="btn block" href="../pembeli/beranda.html">Daftar</a>
  </section>
</div>
</body>
</html>
