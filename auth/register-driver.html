<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrasi Driver</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/app.js" defer></script>
</head>
<body>
<div class="app no-nav">
  <header class="topbar"><a class="back" href="login.html">‹</a><h1>Registrasi Driver</h1></header>
  <section class="section">
    <div class="field"><label>User ID (nama & nopol)</label><input class="input" placeholder="contoh: andi_bh1234xy"></div>
    <div class="field"><label>Nama lengkap</label><input class="input" placeholder="Andi Pratama"></div>
    <div class="field"><label>Nomor polisi kendaraan</label><input class="input" placeholder="BH 1234 XY"></div>
    <div class="field"><label>Nomor WA</label><input class="input" placeholder="08xxxxxxxxxx"></div>
    <div class="field"><label>Password</label><input class="input" type="password"></div>
    <div class="field"><label>Dokumen</label>
      <div class="list-item"><span>🪪</span><span class="grow">KTP</span><span class="badge">Unggah</span></div>
      <div class="list-item"><span>🪪</span><span class="grow">SIM</span><span class="badge">Unggah</span></div>
      <div class="list-item"><span>📄</span><span class="grow">STNK</span><span class="badge">Unggah</span></div>
      <div class="list-item"><span>🤳</span><span class="grow">Foto selfie</span><span class="badge">Unggah</span></div>
    </div>
    <div class="notice">Akun akan aktif setelah dokumen diverifikasi Admin.</div>
    <a class="btn block" href="../driver/beranda.html">Daftar</a>
  </section>
</div>
</body>
</html>
