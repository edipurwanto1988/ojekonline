<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrasi Penjual</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/app.js" defer></script>
</head>
<body>
<div class="app no-nav">
  <header class="topbar"><a class="back" href="login.html">‹</a><h1>Registrasi Penjual</h1></header>
  <section class="section">
    <div class="field"><label>User ID (nama usaha)</label><input class="input" placeholder="contoh: warung_bu_ani"></div>
    <div class="field"><label>Nama usaha</label><input class="input" placeholder="Warung Bu Ani"></div>
    <div class="field"><label>Jenis usaha</label>
      <select class="select"><option>Rumah makan</option><option>Cafe</option><option>Coffee shop</option></select>
    </div>
    <div class="field"><label>Alamat usaha</label><textarea class="textarea"></textarea></div>
    <div class="field"><label>Nomor telepon / WA usaha</label><input class="input" placeholder="08xxxxxxxxxx"></div>
    <div class="field"><label>Password</label><input class="input" type="password"></div>
    <div class="field"><label>Foto usaha</label><div class="upload">📷 Unggah foto</div></div>
    <div class="field"><label>Rekening untuk payout</label><input class="input" placeholder="Bank & nomor rekening"></div>
    <div class="notice">Akun akan aktif setelah disetujui Admin.</div>
    <a class="btn block" href="../penjual/beranda.html">Daftar</a>
  </section>
</div>
</body>
</html>
