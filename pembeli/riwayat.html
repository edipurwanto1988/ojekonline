<html lang="id">
<head>

<title>Riwayat</title>

<body>
<div class="app">

    <div class="list-item">
      <div class="thumb">☕</div>
      <div class="grow"><b>Kopi Senja</b><div class="muted">11 Okt 2026 · 09:10 · QRIS</div></div>

      <div class="thumb">🍗</div>
      <div class="grow"><b>Ayam Geprek Pak Dede</b><div class="muted">10 Okt 2026 · 19:30 · QRIS</div></div>
      <div><div class="price strike">Rp 21.000</div><span class="badge danger">Dibatalkan</span></div>
    </div>
  </section>
  <nav class="bottom-nav">
    <a href="beranda.html"><span class="i">🏠</span>Beranda</a>
